# Minimal local Airflow setup for developing/testing this pipeline.
# Based on the official Airflow quickstart, trimmed to what this project needs.
# NOT intended as a production Airflow deployment (no HA, no external secrets backend).

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # API key and other secrets are injected via .env at runtime, never baked into the image
    STOCK_API_BASE_URL: ${STOCK_API_BASE_URL}
    STOCK_API_KEY: ${STOCK_API_KEY}
    STOCK_API_SYMBOLS: ${STOCK_API_SYMBOLS}
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GCS_RAW_BUCKET: ${GCS_RAW_BUCKET}
    BQ_RAW_DATASET: ${BQ_RAW_DATASET}
    BQ_ANALYTICS_DATASET: ${BQ_ANALYTICS_DATASET}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/gcp-key.json
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./dbt:/opt/airflow/dbt
    - ./logs:/opt/airflow/logs
    - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-./keys}:/opt/airflow/keys:ro
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Airflow --lastname Admin \
          --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  postgres-db-volume:
